# ------------------------------------------------------------
# Additional Data Sources
# ------------------------------------------------------------
twelvedata:
  apikey: ""                # Required if using data_source: "twelvedata"

tvdatafeed:
  username: ""              # Optional (leave blank for free tier without login)
  password: ""              # Optional (leave blank for free tier without login)

# Equity
exchange: "NSE"   # NSE or NASDAQ
symbols:
#- IOC
#- BANKINDIA
#- PNB
#- RPOWER
trend_timeframe: "15m"     # Higher timeframe used as trend filter (HTF)
equity_timeframe: "5m"     # Timeframe for scanning equity symbols (LTF)

# index/option
index_exchange: "NSE_INDEX"    # Exchange for index data
index_symbols:
  - NIFTY18AUG2624500PE
  - NIFTY18AUG2624600PE
  - NIFTY18AUG2624500CE
  - NIFTY18AUG2624600CE

option_timeframes:         # Timeframes for scanning index/option symbols
- 5m

strategy:
  key_value: 2
  atr_period: 1
  use_heikin_ashi: false

sr_channels:
  enabled: false
  pivot_period: 10
  source: "High/Low"
  channel_width_pct: 5
  min_strength: 1
  max_num_sr: 6
  loopback: 290
  proximity_pct: 0.5

data:
  lookback_days: 5

# ------------------------------------------------------------
# MTF Trend Filter
# ------------------------------------------------------------
mtf_filter:
  enabled: true             # true  → trend_timeframe worker runs as trend filter; equity_timeframe only fires when trend agrees
                            # false → trend worker NOT started; only equity_timeframe runs and fires signals freely

bot:
  signal_check_interval: 5        # How often (seconds) the worker wakes to detect a new candle boundary
  auto_scan_enabled: true          # true = auto scanning on; false = manual only via 'Run Scanner' button
  auto_scan_interval_minutes: 5   # How often (minutes) to trigger the scanner — independent of chart timeframe
  market_hours_check: false   # Set to false to run 24/7 (ignores market_open/close)
  market_open: "09:15"       # For US 07:00 PM IST, INDIA - 09:15
  market_close: "15:30"      # For US 01:30 AM IST, INDIA - 15:30
  log_level: "INFO"

ml:
  log_signals: true
  enabled: false
  confidence_threshold: 0.6
  label_lookahead: 5
  win_threshold_pct: 0.3

# ------------------------------------------------------------
# Auto-Trading (Order Placement)
# ------------------------------------------------------------
trading:
  enabled: true
  strategy_name: "UTBot"

  equity:
    enabled: true
    quantity: 100
    product: "CNC"
    price_type: "LIMIT"

  options:
    enabled: true
    quantity: 65
    product: "NRML"
    price_type: "LIMIT"

# ------------------------------------------------------------
# Telegram Alerts
