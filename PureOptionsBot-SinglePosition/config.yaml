# ========================================
# 1. ASSET SELECTION
# ========================================
index_query: "NIFTY"           # Underlying index symbol
index_exchange: "NSE_INDEX"    # Exchange for index data
signal_source: "OPTION"        # Signal source: "INDEX" or "OPTION"

# Option Contract Selection
strike_selection:
  mode: "AUTO"               # "AUTO" or "MANUAL"
  step: 0                      # 0=ATM, -1=ITM1, 1=OTM1
  expiry: "WEEKLY"             # "WEEKLY", "NEXT_WEEK"

trade_symbol: "NIFTY13JAN2626000PE" # Manual fallback symbol

index:
  ltf: {timeframe: "3m", sensitivity: 1.0, atr: 10}
  htf: {timeframe: "15m", sensitivity: 1.0, atr: 10, enabled: True}

option:
  ltf: {timeframe: "1m", sensitivity: 1.5, atr: 10}
  htf: {timeframe: "15m", sensitivity: 1.0, atr: 10, enabled: False}

option_signal_timeout: 5        # Candles to wait for Option signal
index_use_ha: True              # Use Heikin Ashi for Index signals
option_use_ha: False            # Use Heikin Ashi for Option signals (False = Smoother entry)

# --- ADVANCED EXECUTION ---
drift_guard_threshold: 25.0     # Re-resolve strike if Index moves > X points during setup

# ========================================
# 3. TRADE EXECUTION
# ========================================
quantity: 65                    # Order quantity (lot size multiple)
capital: 100000                 # Initial capital for backtesting
lookback_days: 5                # Historical data window
trading_mode: "long"            # "long" or "short"

# ========================================
# 4. RISK MANAGEMENT (3-STAGE PROFIT GUARD)
# ========================================
use_tsl: True                   # Enable trailing stop loss
tsl_mode: "ATR"                 # "ATR" or "TIERED"

# Stage 1: Break-Even (BE) Guard
be_trigger_pct: 2.0             # Profit % to move to Break-even
be_buffer_pts: 1.0              # Points above entry to lock (e.g. 1 pt for brokerage)

# Stage 2: Trailing Logic (Choose based on tsl_mode)
tsl_atr_multiplier: 2.0         # Default ATR multiplier for volatility trail
tsl_points_trail: 5.0           # Default fallback points for tiered trail

# Stage 2b: Dynamic Tiers (Used if mode is TIERED)
tsl_use_dynamic_tiers: True
tsl_point_tiers:
  - {max_entry: 100, trail: 3.5}
  - {max_entry: 250, trail: 7.0}
  - {max_entry: 9999, trail: 12.0}

# Stage 3: High-Profit Tightener (The Leash)
tighten_trigger_pct: 12.0       # At 12% profit, tighten the trail
tighten_ratio: 0.5              # Reduce distance to 50%

