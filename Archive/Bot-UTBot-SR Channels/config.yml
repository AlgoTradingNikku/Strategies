# Bot-UTBot-SR Channels — Configuration

data_source: "yfinance"               # Options: "yfinance", "openalgo", "tvdatafeed", "twelvedata"
exchange: "NSE"                       # Target exchange
scan_timeframe: "5m"                  # Lower Timeframe (e.g., 1m, 3m, 5m, 15m, 30m, 1h, 1d)
scan_interval_seconds: 60            # Interval between scans in continuous mode

# Set to "" or [] to scan only the custom symbols list below
segment:
- NIFTY50
- BANKNIFTY
use_symbols: false

# Number of closed candles to look back for UT Bot signals. 
#(2=current + 1 prior candle)
signal_lookback_candles: 2

# UT Bot Settings
strategy:
  ut_enabled: true
  key_value: 1.0                      # Key Value / Sensitivity (default: 1.0)
  atr_period: 2                       # ATR Period (default: 2)
  use_heikin_ashi: false              # Use Heikin Ashi candle close as price source

# Support/Resistance Channels Settings
sr_channels:
  enabled: true
  pivot_period: 10                    # Period to confirm a pivot (range: 4 to 30)
  source: "High/Low"                  # Source prices: "High/Low" or "Close/Open"
  channel_width_pct: 5.0              # Max channel width as % of 300-bar price range (1 to 8)
  min_strength: 1                     # Minimum pivot strength to qualify a zone
  max_num_sr: 6                       # Maximum number of active S/R zones (1 to 10)
  loopback: 290                       # Bars to scan for pivot collection (100 to 400)
  proximity_pct: 0.2                  # % from boundary to count as "near" (0.0 disables near)

# Setup Filters & Priorities
filters:

  # --- Multi-Timeframe Confirmation ---
  mtf_enabled: true                   # Confirm signals against a higher timeframe
  mtf_timeframe: "15m"                 # Higher TF to check UTBot trend direction
  require_mtf_alignment: false        # If true, only select stock when both timeframes align
                                      # If false, select anyway but cut the confidence score
  mtf_neutral_pct: 0.3                # % proximity to trail to classify trend as "neutral"

  candle_patterns_enabled: true       # Detect candlestick patterns at S/R zones

  # --- EMA Trend Filter ---
  # Regardless of the toggle 'true' or 'false': close above EMA always adds +20 pts to BUY; below EMA adds +20 pts to SELL.
  # Filter (when true): hard-rejects/completely rejects BUY signals where close <= EMA, and SELL signals where close >= EMA.
  ema_filter_enabled: false
  ema_period: 200                     # EMA period for trend filter and scoring (e.g. 50, 100, 200)

  # --- Volume Filter ---
  # Regardless of the toggle 'true' or 'false':: volume surge always contributes up to +20 pts (10 × vol/SMA, capped at 20) — regardless of this toggle true or false
  # Filter (when true): hard-rejects any signal where current volume < volume_min_pct % of its SMA.
  volume_filter_enabled: true         # true: Rejects the low-volume stocks | false = score only, no rejection
  volume_sma_period: 20               # SMA period for volume moving average (e.g. 10, 20, 50)
  volume_min_pct: 60                  # Min volume as % of SMA to pass the hard filter (e.g. 60 = reject if vol < 60% of SMA)

  # --- Alert Score Cutoff ---
  min_alert_score: 70                 # Minimum setup score to send priority Telegram alert (0-100)

  # --- ADX Trend Strength ---
  adx_filter_enabled: false           # true: Rejects the stocks when ADX < threshold | false = score only, no rejection
  adx_min_threshold: 20.0             # ADX below this = no trend, reject signal (when hard filter ON)
  adx_strong_threshold: 25.0          # ADX >= this = strong trend (+10 pts to score)
  adx_moderate_threshold: 20.0        # ADX >= this = moderate trend (+5 pts to score)

  # --- RSI Momentum Scoring ---
  rsi_filter_enabled: true            # true: Rejects the stocks when RSI is outside optimal range | false = score only, no rejection
  rsi_period: 14                      # RSI calculation period
  rsi_buy_min: 40.0                   # BUY gets +10 pts when RSI is between buy_min and buy_max
  rsi_buy_max: 65.0
  rsi_sell_min: 35.0                  # SELL gets +10 pts when RSI is between sell_min and sell_max
  rsi_sell_max: 60.0

  # --- Relative Strength vs NIFTY ---
  rs_period: 20                       # Lookback bars for RS ratio calculation vs NIFTY50
  rs_buy_threshold: 1.1               # RS ratio above this = outperforming NIFTY (+10 pts for BUY)
  rs_sell_threshold: 0.9              # RS ratio below this = underperforming NIFTY (+10 pts for SELL)

  # --- Risk/Reward Calculator ---
  risk_reward_enabled: true           # Calculate SL/Target/R:R for each signal
  rr_atr_multiplier: 0.5              # ATR buffer added beyond stop level
  rr_default_ratio: 2.0               # Default target R:R when no S/R zone found


  # --- Signal History & Outcome Tracking ---
  signal_history_enabled: true        # Log signals to SQLite for outcome tracking
  outcome_check_hours: 4              # Hours after signal to check outcome

