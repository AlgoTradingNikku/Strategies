#- IOC
#- BANKINDIA
#- PNB
#- RPOWER
trend_timeframe: "15m"     # Higher timeframe used as trend filter (HTF)
equity_timeframe: "5m"     # Timeframe for scanning equity symbols (LTF)

# index/option
index_exchange: "NSE_INDEX"    # Exchange for index data
index_symbols:
- NIFTY18AUG2624500PE
- NIFTY18AUG2624600PE
- NIFTY18AUG2624500CE
- NIFTY18AUG2624600CE
option_timeframes:         # Timeframes for scanning index/option symbols
- 5m
strategy:
  key_value: 2
  atr_period: 1
  use_heikin_ashi: false

sr_channels:
  enabled: false
  pivot_period: 10
  source: "High/Low"
  channel_width_pct: 5
  min_strength: 1
  max_num_sr: 6
  loopback: 290
  proximity_pct: 0.5

data:
  lookback_days: 5

# ------------------------------------------------------------
# MTF Trend Filter
# ------------------------------------------------------------
mtf_filter:
  enabled: false            # true  → trend_timeframe worker runs as trend filter; equity_timeframe only fires when trend agrees
                            # false → trend worker NOT started; only equity_timeframe runs and fires signals freely

bot:
  auto_scan_enabled: true          # true = auto scanning on; false = manual only via 'Run Scanner' button
  auto_scan_interval_minutes: 1   # How often (minutes) to trigger the scanner — independent of chart timeframe
  market_hours_check: false   # Set to false to run 24/7 (ignores market_open/close)
  market_open: "09:15"       # For US 07:00 PM IST, INDIA - 09:15
  market_close: "15:30"      # For US 01:30 AM IST, INDIA - 15:30
  log_level: "INFO"

ml:
  log_signals: true
  enabled: false
  confidence_threshold: 0.6
  label_lookahead: 5
  win_threshold_pct: 0.3

# ------------------------------------------------------------
# Auto-Trading (Order Placement)
# ------------------------------------------------------------
trading:
  enabled: true
  strategy_name: "UTBot"

  equity:
    enabled: true
    quantity: 100
    product: "CNC"
    price_type: "LIMIT"

  options:
    enabled: true
    quantity: 65
    product: "NRML"
    price_type: "LIMIT"

# ------------------------------------------------------------
# Trade Management — automatic SL / target / trailing-SL / profit-lock /
# partial-exit monitoring for positions opened by this bot's auto-trading.
#
# ROLLOUT: keep `enabled: false` until you've watched this run for a few
# sessions with trading.enabled temporarily off (or on a throwaway symbol) —
# the percentages below are starting points, not tuned values. Positions are
# tracked in trades.db (separate from signals.db) and the dashboard's
# Positions tab reads from it once this is on.
# ------------------------------------------------------------
trade_management:
  enabled: false
  poll_interval_seconds: 5       # HTTP-polling fallback when the trade-management WebSocket is briefly down

  # Initial SL and Target as a percentage of the option's ENTRY PREMIUM (not
  # the underlying's price). Option premiums commonly swing 15-40%+ intraday
  # on a single directional move — much wider than the 1-2% you'd use for a
  # stock — so these starting values are deliberately wide. Tighten them
  # after watching a few days of real premium behaviour per symbol.
  stop_loss_pct: 20
  target_pct: 40

  # Scale out of the position in tranches as it moves favourably.
  partial_exit:
    enabled: false
    tiers:
    - trigger_pct: 20
      exit_qty_fraction: 0.5
      move_sl_to_be: true
  trailing_sl:
    enabled: false
    activation_pct: 15           # Minimum premium gain before trailing activates
    tiers:
    - min_gain_pct: 15
      distance_pct: 10
    - min_gain_pct: 30
      distance_pct: 6
  profit_lock:
    enabled: false
    tiers:
    - threshold_pct: 20
      lock_fraction: 0.3
    - threshold_pct: 35
      lock_fraction: 0.5
  notifications:
    on_open: true
    on_exit: true
    on_partial_exit: true
    on_profit_lock: true
    on_sl_move: false

