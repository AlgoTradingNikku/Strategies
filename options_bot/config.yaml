api:
  api_key: "a2edab0147e5058617b63b677c82c5c44533d356d8b8f33734127d6c5f029a55"
  host: "http://127.0.0.1:5000"
  websocket_url: "ws://127.0.0.1:8765"
  strategy_name: "OptionsScalper_HA"  # Optional: Used to identify trades in OpenAlgo dashboard

paper_trading: false
live_trading: true

strategy_settings:
  timeframe_htf: "10m"   # High Time Frame for trend detection (e.g., 15m, 1h)
  timeframe_ltf: "3m"    # Low Time Frame for trade entry signals (e.g., 3m, 5m)
  wait_for_candle_close: true  # If true, signals only trigger after a candle finishes
  candle_type: "HEIKIN_ASHI"   # Options: OHLC (Standard), HEIKIN_ASHI (Smoothed)
  allow_late_entry: false      # If true, bot enters anytime a signal is active. False = ONLY on fresh signal.
  enable_pullback_entry: true  # Experimental: Wait for minor pullback before entry
  max_reentries: 3             # Limit number of attempts for the same signal
  min_gap_time: "0m"           # Cool-down between trades (e.g., '3m', '5m')
  order_type: "LIMIT"          # Options: LIMIT (less slippage), MARKET (instant fill)

strike_selection:
  mode: "ATM_OFFSET"           # Options: ATM_OFFSET (using strike_step), PREMIUM (target specific price)
  strike_step: 0               # 0 = ATM, +1 = 1 strike OTM, -1 = 1 strike ITM
  target_premium: 100          # For PREMIUM mode: Find strike closest to this price
  expiry_type: "CURRENT_WEEKLY" # Options: CURRENT_WEEKLY, NEXT_WEEKLY, MONTHLY
  auto_switch_on_expiry_day: false # Automatically switch to next expiry on Tuesday/Thursday

indicators:
  ema_fast: 9
  ema_slow: 21
  rsi_period: 14
  rsi_overbought: 55
  rsi_oversold: 45
  stoch_period: 14
  stoch_k: 3
  stoch_d: 3
  stoch_overbought: 80
  stoch_oversold: 20
  utbot_key: 1
  utbot_atr: 10

active_indicators:
  # HTF Indicators for trend filtering
  htf:
    - 
  # LTF Indicators for signal triggers
  ltf:
    - "utbot"

position_sizing:
  mode: "LOTS"                 # Options: LOTS, CAPITAL
  lots_per_trade: 1
  capital_per_trade: 10000

risk_management:
  target_profit_pct: 0         # Target Profit %. 0 = UNLIMITED (Ride the trend)
  
  # Trailing Stop Settings
  tsl_mode: "PERCENT"          # Options: PERCENT, ATR
  tsl_atr_multiplier: 2.0      # Only used in ATR mode

  entry_stop_loss_pct: 3            # Intial Stop Loss %
  trailing_activation_pct: 2  # Activate TSL only after 10% profit
  trailing_stop_pct: 4       #  TSL: Trailing distance in PERCENT mode
  profit_lock_pct: 1           # Lock 2% profit as a floor once activation is hit
  
  max_daily_acceptable_loss: 0 # Stops bot if total daily loss exceeds this (0 = disabled)
  max_entry_price: 0           # Max price to buy option at. Set to 0 for NO LIMIT.
  max_positions: 2             # Max simultaneous open trades

trading_hours:
  start_time: "09:15"
  stop_time: "15:15"
  sq_off_time: "15:25"

general:
  symbols:
    - "NIFTY"
    - "BANKNIFTY"
  log_level: "INFO"

# Clarifying "The 1:2 Ratio Settings" Question
# I asked: "Would you like to put these 1:2 Ratio settings (TSL 5%, Lock 1% at 3% profit) into the default config?"

# Here is exactly what that means:

# I am suggesting that in the config.json file we create for you, I pre-fill the values with this specific logic:
# Why this specific combo (1% Lock at 3% Activation)?

# The "1:2 Ratio": The Activation (3%) is roughly 3x the Lock (1%).
# The Benefit: If we activated the lock at 1.5% profit, the buffer would be tiny (1.5% current - 1.0% lock = 0.5% buffer). A tiny wobble would hit your stop instantly.
# By waiting for 3%, the moment the lock turns on (at 1%), you still have a 2% gap between current price and stop loss. This keeps the trade alive!
