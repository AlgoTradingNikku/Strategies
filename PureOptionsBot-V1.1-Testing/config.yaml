strategy_name: "PureOptionsBot"

# ========================================
# 1. ASSET SELECTION & MODE
# ========================================
live_trade: True               # Set to True for real orders, False for observation only
index_query: "NIFTY"           # Underlying index symbol
index_exchange: "NSE_INDEX"    # Exchange for index data
signal_source: "OPTION"        # Signal source: "INDEX" or "OPTION"

# Option Contract Selection
strike_selection:
  mode: "MANUAL"                 # "AUTO" or "MANUAL"
  step: 0                      # 0=ATM, -1=ITM1, 1=OTM1
  expiry: "WEEKLY"             # "WEEKLY", "NEXT_WEEK"
  offset: 0                    # 0 for current week, 1 for next week

  # ========================================
  # MANUAL MODE CONFIGURATION (Advanced)
  # ========================================
  # Provide a "Basket" of symbols to trade.
  # The bot will scan ALL symbols in this list and execute ANY that match the logic.
  # Example: If Bullish, it checks all CE symbols. If valid setup, it buys.
  manual_strikes: 
    - "NIFTY20JAN2625700CE"
    - "NIFTY20JAN2625700PE"
    - "NIFTY20JAN2625600CE"
    - "NIFTY20JAN2625600PE"
    - "NIFTY20JAN2625500CE"
    - "NIFTY20JAN2625500PE"
    #- "NIFTY20JAN2625900CE"
    #- "NIFTY20JAN2625900PE"
  # Price Cap Logic:
  # Prevents buying expensive options. Set to 0 to DISABLE (Unlimited).
  # Useful for hero-zero trades or strict budget allocation.
  max_option_price: 100          # Limit entry if Price > X. (0 = No Limit)
  
# ========================================
# 2. STRATEGY PARAMETERS (EMA/ADX/RSI Logic)
# ========================================

# Timeframe Layers
trend_tf: "15m"                  # Used for Bias (EMA Cross) and Trend Filter (ADX)
execution_tf: "3m"               # Used for Entry Filters (RSI, ADX, EMA50) and UTBot Trigger

strategy:
  # Bias (Trend TF)
  bias:
    ema_fast: 50
    ema_slow: 200
  
  # Filters (Execution TF)
  filters:
    adx_threshold_trend_tf: 25   # ADX on 15m must be > this
    adx_threshold_exec_tf: 20    # ADX on 3m must be > this
    rsi_threshold_buy: 50        # RSI on 3m must be > this for CE
    rsi_threshold_sell: 50       # RSI on 3m must be < this for PE
    ema_signal: 50               # Price must be same side of EMA 50 on 3m
  
  # Distance Guard (Execution TF)
  # Prevents entry if too far from EMA50 (No FOMO)
  distance_guard:
    enabled: True
    multiplier: 1.5              # Distance <= X * ATR_3m
                                 # 3m: 1.5, 5m: 1.7, 10m: 2.0, 15m: 2.3

# Indicator Reference Tables (From Images):
# ---------------------------------------------------------
# ADX Thresholds | Exec (3m/5m: 20, 10m/15m: 18) | Trend (3m: 25, 5m: 23, 10m: 22, 15m: 20)
# RSI Buy/Sell   | 3m: 50/50 | 5m: 52/48 | 10m: 53/47 | 15m: 55/45
# UTBot (Index)  | 3m: 10/2.0 | 5m: 10/2.2 | 10m: 14/2.5 | 15m: 14/3.0
# ---------------------------------------------------------

index:
  ltf: {timeframe: "3m", sensitivity: 2.0, atr: 10, min_bars: 50}
  htf: {timeframe: "15m", sensitivity: 3.0, atr: 14, min_bars: 100} #For EMA200 min bar 200. For testing kept 100

option:
  ltf: {timeframe: "1m", sensitivity: 1.0, atr: 10, min_bars: 20}

option_signal_timeout: 5        # Number of actual CANDLES to wait for Option signal (e.g. 5m if on 1m chart)
index_use_ha: True              # Use Heikin Ashi for Index signals
option_use_ha: True            # Use Heikin Ashi for Option signals

drift_guard_threshold: 25.0     # Re-resolve strike if Index moves > X points during setup
fetch_interval_seconds: 5       # Scanner Loop: Frequency of checking for NEW signals (Seconds)
fast_check_seconds: 2           # Risk Loop: Freq of checking TSL/Exits/Sync (Bodyguard speed)
ignore_session_check: False     # Safety: Verify API token validity (one time when bot starts) before trading (Keep False)

# ========================================
# 3. ENTRY LOGIC CONTROLS
# ========================================
entry_logic:
  # -----------------------------------------
  # INDEX TRIGGER (Phase 1 - CE/PE Strike Selection)
  # -----------------------------------------
  # Determines when to start looking at strikes based on Nifty trend.
  # NIFTY: "The Green Light"
  # Set to a huge number (e.g., 50 candles = 150 mins).
  # Meaning: "As long as Nifty is Bullish, keep scanning."

  # index_max_trend_age:
  #   0 = SNIPER MODE: Only triggers on the exact candle Nifty turns Green.
  #   X = WINDOW MODE: Triggers if Nifty is Green and trend is <= X candles old.
  #       (Recommended: 2 for 3m chart = 9 min window)
  index_max_trend_age: 50  # ltf candels 
  
  # -----------------------------------------
  # OPTION TRIGGER (Phase 2 - BUY Order Execution)
  # -----------------------------------------
  # Determines when to actually EXECUTE the BUY order.

  # OPTION: "The Trigger"
  # Keep this tight! We only want FRESH momentum.

  # option_max_trend_age:
  #   0 = SNIPER MODE: Only Buy on exact crossover candle. (Risk: Misses fast moves)
  #   X = WINDOW MODE: Buy if Option is Bullish and trend is <= X candles old.
  #       (Recommended: 2 for 1m chart = 3 min window)
  option_max_trend_age: 50 # ltf candels
  
  # -----------------------------------------
  # PULLBACK ENTRY SETTINGS
  # -----------------------------------------
  # Works in both SIGNAL and STATE modes
  allow_index_pullback: False     # Enable mid-trend setup detection on Index (Red-to-Green bounce)
  allow_option_pullback: True     # Enable mid-trend entry on Option Premium (Red-to-Green bounce)
  pullback_warmup_candles: 3      # Wait for X candles in trend before allowing pullback entries 
# ========================================
# 3. PORTFOLIO & EXECUTION
# ========================================
lots: 1                         # Multiplier for contract lot size (Dynamic lookup)
max_positions: 4                # Maximum concurrent active trades
capital: 1000000                # for backtesting/reporting
lookback_days: 5                # Historical data window (3-5 days is optimal for speed)
trading_mode: "BUY"            # "BUY" (Long Options) or "SELL" (Short/Write Options)


# ========================================
# 4. RISK MANAGEMENT (3-STAGE PROFIT GUARD)
# ========================================

# === STAGE 1: Break-Even (BE) Guard ===
# Locks in profits once trade reaches a threshold
# Purpose: Protect against giving back gains
#
# ANTI-WHIPSAW TIP: Don't lock too early! Options oscillate ±3-5% normally
be_trigger_pct: 3.0             # Wait for +3% profit before activating BE
be_buffer_pts: 4.0              # Lock stop 4 points above entry (Tighter)
                                # Example: Entry ₹120 → BE locks at ₹122

# Trail distance adapts to market volatility automatically
# Formula: TSL Distance = Index_ATR × Multiplier (with minimum floor)
#
# How it works:
# - Volatile market (ATR=20) → Trail at 50 points (20×2.5) → Room to breathe
# ==============================================================================
# TRAILING STOP LOSS (TSL) SETTINGS
# ==============================================================================
# TSL follows the price up (for Buy) and marks a "brick wall" fallback level.
# It only moves in your favor, never against you.
# 

# 1. TSL MODE SELECTION
# Choose between: "ATR", "PERCENT", or "POINTS"
tsl_mode: "PERCENT"

# --- Mode 1: ATR-Based (Volatility Aware) ---
# Calculation: Peak Price - (Multiplier * ATR)
# Automatically widens in high volatility, tightens in calm markets.
tsl_atr_multiplier: 3.5          # Standard: 1.5 (Aggressive) to 3.5 (Conservative)

# --- Mode 2: Percentage-Based ---
# Calculation: Peak Price - (Peak Price * Percentage/100)
# Example: If Peak is 100 and TSL is 4%, Stop is at 96.
tsl_percent: 3.0                 # Tightened from 10.0% to 4.0%

# --- Mode 3: Point-Based ---
# Calculation: Peak Price - Fixed Points
# Example: If Peak is 100 and Points is 8, Stop is at 92.
tsl_points: 8.0                  # Fixed gap in points from the peak price

# --- Safety Gap (Applicable to ALL modes) ---
# This is the "Safety Floor". It ensures your stop loss never gets 
# dangerously close to the price during periods of zero volatility.
min_trailing_gap: 2.0            # Increased safety floor

# --- TSL Customization (Advanced) ---
# Period for ATR calculation used in TSL (Risk Management)
tsl_atr_period: 14               # Standard: 14. Lower = Faster, Higher = Smoother.

re_entry_protection:
  enabled: True
  
  # DYNAMIC COOLDOWN (Based on Exit Reason):
  # Different wait times based on WHY you exited
  # Logic: Good exits = short wait, Bad exits = long wait
  #
  cooldown_after_profit_mins: 5    # TSL hit with profit
                                   # Short cooldown - it was a good exit
                                   # Quick re-entry allowed if trend continues
  
  cooldown_after_loss_mins: 5      # TSL/Stop hit with loss (Reduced for more aggression)
                                   # wait 10m to avoid immediate revenge trading
                                   
  cooldown_after_reversal_mins: 5  # Trend reversal exit
                                   # wait 10m for new trend to establish
                                   # Medium cooldown - trend changed
                                   # Wait for new trend to establish
  
  # TIP: Set all three to same value (e.g., 15) for fixed cooldown
  
  # Time-Based Exit (Theta Protection):
  # Exit if position goes nowhere for too long
  max_hold_mins: 120            # Exit after 2 hours if profit < threshold
  min_profit_to_hold: 5.0       # Must have 5%+ profit to hold beyond 2hrs
                                # Prevents theta decay eating stagnant trades
  
  # Volatility Adjustment (Advanced):
  # Widen TSL in high IV environments
  adapt_to_iv: True             # Adjust TSL based on Implied Volatility
  iv_multiplier: 1.0            # Base multiplier (1.0 = no adjustment)
                                # At IV=30%, multiplier becomes 1.5
                                # Gives more room when market is wild
  
  # Strike Fallback (Smart Re-Entry):
  # If primary strike is blocked, try adjacent strikes
  # Prevents missing rallies while still avoiding same-strike whipsaws
  allow_adjacent_strikes: True  # Try next strike if primary blocked
  max_strike_offset: 1          # How far to search (±1 strike max)
                                # Example: ATM blocked → Try OTM, then ITM
                                # Ensures you don't miss strong moves


# ========================================
# 5. PROFESSIONAL EXECUTION CONTROLS (NEW)
# ========================================
execution:
  order_type: "LIMIT"           # MARKET, LIMIT, or ADAPTIVE
  limit_offset_pct: 0.5         # % above ask for buy, below bid for sell
  max_spread_pct: 10.0          # Reject entry if spread > this %
  order_timeout_sec: 5          # Cancel unfilled orders after X seconds
  min_oi: 0                     # Minimum Open Interest required
  retry_count: 2                # Number of order retry attempts
  retry_count: 2                # Number of order retry attempts
  aggressive_momentum_entry: True # Allow entry even without quotes if chart signal is fresh
  
  # AUTO-SELL CONTROL
  # True: Bot places SELL orders automatically (Hands-free).
  # False: Bot only ALERTS you to sell. You must exit manually on broker.
  #        (Bot will sync and remove position once you close it).
  enable_bot_auto_sell: True

# ========================================
# 6. DAILY RISK CONTROLS (NEW)
# ========================================
risk_controls:
  enabled: True                 # Master switch for daily controls
  max_daily_loss: 200000          # Rs. - stop trading for the day
  max_loss_per_trade: 50000       # Rs. - force exit individual trade
  max_capital_at_risk_pct: 100    # % of capital - total exposure check
  cool_down_after_loss_sec: 300 # Seconds before next trade after loss

# ========================================
# 7. EXPIRY & TIMING RULES (NEW)
# ========================================
expiry_rules:
  avoid_new_entry_on_expiry: False   # Don't enter new trades on expiry day
  exit_all_by_time: "23:30"         # Auto-square all positions by this time
  increase_tsl_on_expiry: 1.5       # Tighten stops by 50% on expiry day
  min_dte: 0                        # Minimum Days-To-Expiry (0=allow same day)

trading_hours:
  enabled: True                 # Enforce time-based restrictions
  start_time: "09:00"           # Don't trade before (avoid opening volatility)
  end_time: "23:30"             # Don't enter new trades after
  avoid_lunch: false            # True: Pause during lunch hour
  lunch_start: "12:30"
  lunch_end: "13:30"

# ========================================
# 8. GREEKS MONITORING (OPTIONAL)
# ========================================
greeks_monitoring:
  enabled: False                # Display option Greeks in heartbeat (Disabled as requested)
  # When enabled, shows Delta, Gamma, Theta, Vega, IV
  # Adds ~50-100ms per heartbeat (every 10 seconds)
  # Set to False for maximum performance

