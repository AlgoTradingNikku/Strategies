# Note: BREAK-EVEN logic is still active. 
# Once price moves +2.0%, the stop will jump to Entry + 1pt (if not already higher).
# This is defined in the internal Risk Management section.
# === RE-ENTRY PROTECTION (ANTI-WHIPSAW) ===
# Prevents immediately re-entering a position you just exited
# This stops the costly "chop and churn" pattern in sideways markets
#
# HOW IT WORKS:
# 1. You exit NIFTY25700CE at 10:30 AM
# 2. Symbol added to "blacklist" for X minutes (based on exit reason)
# 3. Next signal at 10:35 AM tries to enter same symbol
# 4. Bot: "BLOCKED - wait Y more minutes"
# 5. Saves you from whipsaw losses + double brokerage
#

# 1. Moderate/Safe (Best for Nifty Intraday)
# index:
#   ltf: {timeframe: "3m", sensitivity: 1.5, atr: 10}
#   htf: {timeframe: "15m", sensitivity: 2.0, atr: 14, enabled: True}

# 2. Volatile Market (High IV / News Events)
# index:
#   ltf: {timeframe: "5m", sensitivity: 2.5, atr: 14}
#   htf: {timeframe: "15m", sensitivity: 3.0, atr: 20, enabled: True}

# 3. Trending/Momentum (Catching a Rally)
# index:
#   ltf: {timeframe: "3m", sensitivity: 1.0, atr: 10}
#   htf: {timeframe: "15m", sensitivity: 1.5, atr: 10, enabled: True}

# Option Sensitivity: Since options move faster than the index (due to Delta/Gamma), I recommend keeping the option sensitivity 0.5 higher than the index sensitivity if you are using signal_source: "OPTION".
# ATR Multiplier for TSL: In your config.yaml , the tsl_atr_multiplier is at 2.5. In volatile markets, if you find yourself getting stopped out too early, increase this to 3.5.


  
