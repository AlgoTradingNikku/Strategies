# ============================================================
# Bot-UTBot-SR Channels — Configuration
# ============================================================

# ------------------------------------------------------------
# 1. CORE SCANNER SETTINGS
# ------------------------------------------------------------
data_source: "yfinance"               # Options: "yfinance", "openalgo", "tvdatafeed", "twelvedata"
exchange: "NSE"                       # Target exchange
scan_timeframe: "5m"                  # Timeframe (e.g., 1m, 3m, 5m, 15m, 30m, 1h, 1d)
scan_interval_seconds: 60            # Interval between scans in continuous mode

# Set to "" or [] to scan only the custom symbols list below
segment: ["NIFTY50", "BANKNIFTY"]

# Set to true to merge the custom 'symbols' list with the active segments
use_symbols: false

# "UTBot"    — Generate signals based solely on UT Bot
# "SR"       — Generate signals based solely on SR Channels
# "UTBot+SR" — Generate signals only when BOTH conditions are satisfied
signal_mode: "UTBot+SR"

# Number of closed candles to look back for UT Bot signals. 
#(2=current + 1 prior candle)
signal_lookback_candles: 1

# UT Bot Settings
strategy:
  ut_enabled: true
  key_value: 1.0                      # Key Value / Sensitivity (default: 1.0)
  atr_period: 2                       # ATR Period (default: 2)
  use_heikin_ashi: false              # Use Heikin Ashi candle close as price source

# Support/Resistance Channels Settings
sr_channels:
  enabled: true
  pivot_period: 10                    # Period to confirm a pivot (range: 4 to 30)
  source: "High/Low"                  # Source prices: "High/Low" or "Close/Open"
  channel_width_pct: 5                # Max channel width as % of 300-bar price range (1 to 8)
  min_strength: 1                     # Minimum pivot strength to qualify a zone
  max_num_sr: 6                       # Maximum number of active S/R zones (1 to 10)
  loopback: 290                       # Bars to scan for pivot collection (100 to 400)
  proximity_pct: 0.2                  # % from boundary to count as "near" (0.0 disables near)

# Setup Filters & Priorities
filters:
  ema_filter_enabled: true            # Filter out BUY below EMA 200 / SELL above EMA 200
  volume_filter_enabled: true         # Filter out signals with below-average volume
  min_alert_score: 70                 # Minimum setup score to send priority alert (0-100)

  # Multi-Timeframe Confirmation
  mtf_enabled: true                   # Confirm signals against a higher timeframe
  mtf_timeframe: "1h"                # Higher TF to check UTBot trend direction

  # ADX Trend Strength
  adx_filter_enabled: false           # Hard-reject signals when ADX < threshold
  adx_min_threshold: 20               # ADX below this = no trend, reject signal

  # Risk/Reward Calculator
  risk_reward_enabled: true           # Calculate SL/Target/R:R for each signal
  rr_atr_multiplier: 0.5             # ATR buffer added beyond stop level
  rr_default_ratio: 2.0              # Default target R:R when no S/R zone found

  # Candlestick Pattern Recognition
  candle_patterns_enabled: true       # Detect candlestick patterns at S/R zones

  # Signal History & Outcome Tracking
  signal_history_enabled: true        # Log signals to SQLite for outcome tracking
  outcome_check_hours: 4              # Hours after signal to check outcome

# Telegram Alerts
telegram:
  mode: "direct"                      # "direct" (via Bot API) or "openalgo" (via server)
