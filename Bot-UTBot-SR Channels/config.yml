# ============================================================
# Bot-UTBot-SR Channels — Configuration
# ============================================================

# ------------------------------------------------------------
# 1. CORE SCANNER SETTINGS
# ------------------------------------------------------------
data_source: "yfinance"               # Options: "yfinance", "openalgo", "tvdatafeed", "twelvedata"
exchange: "NSE"                       # Target exchange
scan_timeframe: "5m"                  # Timeframe (e.g., 1m, 3m, 5m, 15m, 30m, 1h, 1d)
scan_interval_seconds: 300            # Interval between scans in continuous mode

# Market segments to scan dynamically (accepts single string or list)
# Set to "" or [] to scan only the custom symbols list below
segment: ["NIFTY50", "BANKNIFTY"]

# Set to true to merge the custom 'symbols' list with the active segments
use_symbols: false

# ------------------------------------------------------------
# 2. SIGNAL COMBINATION MODE
# ------------------------------------------------------------
# "UTBot"    — Generate signals based solely on UT Bot
# "SR"       — Generate signals based solely on SR Channels
# "UTBot+SR" — Generate signals only when BOTH conditions are satisfied
signal_mode: "UTBot+SR"

# Number of closed candles to look back for UT Bot signals (default: 2)
signal_lookback_candles: 2

# ------------------------------------------------------------
# 3. STRATEGY PARAMETERS
# ------------------------------------------------------------
# UT Bot Settings
strategy:
  ut_enabled: true
  key_value: 1.0                      # Key Value / Sensitivity (default: 1.0)
  atr_period: 2                       # ATR Period (default: 2)
  use_heikin_ashi: false              # Use Heikin Ashi candle close as price source

# Support/Resistance Channels Settings
sr_channels:
  enabled: true
  pivot_period: 10                    # Period to confirm a pivot (range: 4 to 30)
  source: "High/Low"                  # Source prices: "High/Low" or "Close/Open"
  channel_width_pct: 5                # Max channel width as % of 300-bar price range (1 to 8)
  min_strength: 1                     # Minimum pivot strength to qualify a zone
  max_num_sr: 6                       # Maximum number of active S/R zones (1 to 10)
  loopback: 290                       # Bars to scan for pivot collection (100 to 400)
  proximity_pct: 0.0                  # % from boundary to count as "near" (0.0 disables near)

# ------------------------------------------------------------
# 4. EXTERNAL APIS & ALERTING
# ------------------------------------------------------------
