# HTF Alignment: Always keep htf: enabled: True. It acts as a safety filter. If the 3m chart says "Buy" but the 15m chart says "Sell," the bot will stay out, saving you from "fake" rallies in a downtrend.
# ATR Multiplier for TSL: In your config.yaml , the tsl_atr_multiplier is at 2.5. In volatile markets, if you find yourself getting stopped out too early, increase this to 3.5.


  
