strategy_name: "PureOptionsBot"

# ========================================
# 1. ASSET SELECTION & MODE
# ========================================
live_trade: True               # Set to True for real orders, False for observation only
index_query: "NIFTY"           # Underlying index symbol
index_exchange: "NSE_INDEX"    # Exchange for index data
index_use_ha: False            # False = OHLC (Recommended), True = Heikin-Ashi
signal_source: "OPTION"        # Signal source: "INDEX" or "OPTION"

# Option Contract Selection
strike_selection:
  mode: "MANUAL"                 # "AUTO" or "MANUAL"
  step: 0                      # 0=ATM, -1=ITM1, 1=OTM1
  expiry: "WEEKLY"             # "WEEKLY", "NEXT_WEEK"
  offset: 0                    # 0 for current week, 1 for next week

  # ========================================
  # MANUAL MODE CONFIGURATION (Advanced)
  # ========================================
  # Provide a "Basket" of symbols to trade.
  # The bot will scan ALL symbols in this list and execute ANY that match the logic.
  # Example: If Bullish, it checks all CE symbols. If valid setup, it buys.
  manual_strikes: 
    - "NIFTY20JAN2625700CE"
    - "NIFTY20JAN2625700PE"
    - "NIFTY20JAN2625600CE"
    - "NIFTY20JAN2625600PE"
    - "NIFTY20JAN2625500CE"
    - "NIFTY20JAN2625500PE"
    #- "NIFTY20JAN2625900CE"
    #- "NIFTY20JAN2625900PE"
  # Price Cap Logic:
  # Prevents buying expensive options. Set to 0 to DISABLE (Unlimited).
  # Useful for hero-zero trades or strict budget allocation.
  max_option_price: 150          # Limit entry if Price > X. (0 = No Limit)
  
# ========================================
# 2. STRATEGY PARAMETERS (Smart Momentum)
# ========================================

# Timeframe Layers
trend_tf: "15m"                  # Used for Master Trend (Bias)
execution_tf: "3m"               # Used for Signals and Confirmation

# Option Chart Settings (for entry validation)
option:
  ltf:
    timeframe: "3m"              # Option chart timeframe for VWAP/EMA/Volume checks
    use_ha: False                # False = OHLC (Recommended for Options), True = HA

strategy:
  smart_momentum:
    enabled: True
    entry_mode: "ADVANCED"         # Options: "SIMPLE" (minimal checks) or "ADVANCED" (all filters)
    
    # MASTER TREND (NIFTY 15m/Trend TF)
    master_trend:
      enabled: False              # Toggle: Enable/Disable Master Trend filter
      ema_fast: 9                # Fast EMA (trend direction)
      ema_mid: 21                # Mid EMA (trend confirmation)
      ema_slow: 50               # Slow EMA (structure filter)
      adx_period: 14             # ADX period
      rsi_period: 14             # RSI period
      adx_threshold: 20          # Minimum Trend Strength
      rsi_bull_min: 55           # Minimum RSI for Bullish Trend
      rsi_bear_max: 45           # Maximum RSI for Bearish Trend
      
    # Explosive Trend Detection (NIFTY)
    explosive_trend:
      enabled: True
      adx_min: 30                # ADX > 30 on 15m
      min_body_pct: 0.005        # Body >= 0.5% of Close
      min_body_ratio: 0.6        # Body/Range >= 0.6
      min_close_pos: 0.75        # (Close-Low)/Range >= 0.75
      
    wait_logic:                  # PATH 2: SMART WAIT (Conditional)
      max_retrace_pct: 0.30      # Max retracement allowed (30% of signal candle body)

    # ENTRY CONFIRMATION (Option Chart)
    entry_confirmation:
      use_atr_price_cap: True    # Use ATR-based dynamic max price (Better than fixed %)
      atr_multiplier: 1.5        # Max Price = VWAP + (1.5 × ATR)
      vwap_max_buffer: 1.015     # Fallback if ATR disabled: Price <= VWAP * 1.015
      check_spread: False        # Toggle: check Bid-Ask Spread (Requires API Call)
      max_spread_pct: 0.003      # Spread <= 0.3%
     
      ema_fast: 9
      ema_slow: 21
      volume_multiplier: 1.2     # Current Volume > 1.2x Avg
      check_upper_wick: True     # Reject if upper wick > body (Rejection candle)
      check_delta: False         # Check Delta >= 0.50 (If Greeks available)

      
    # WAIT LOGIC
    wait_candles: 1              # Wait X candles after signal before entering

# ========================================
# RE-ENTRY PROTECTION
# ========================================
re_entry_protection:
  enabled: True
  cooldown_after_loss_mins: 3    # Wait 3 mins (1 Candle3m) after a LOSS (Whipsaw protection)
                                 # Lost on 25700CE? Cooldown for 25700CE ONLY.
  cooldown_after_profit_mins: 0  # Wait 0 mins after a PROFIT (Immediate re-entry allowed)

# ========================================
# 3. TRADING HOURS & LIMITS
# ========================================
trading_hours:
  enabled: True
  start_time: "09:25"           # Post-opening settle
  end_time: "15:00"             # No new trades after this
  sq_off_time: "15:20"          # Hard exit all positions
  avoid_lunch: False

# ========================================
# 4. EXECUTION (Smart Limit)
# ========================================
execution:
  order_type: "SMART_LIMIT"     # New Logic: min(Bid, VWAP, PrevClose)
  limit_offset_pct: 0.0         # No extra buffer, strictly strict
  max_spread_pct: 0.3           # Strict spread check when check_spread: true
  order_timeout_sec: 8          # Wait 8s for fill then cancel
  enable_bot_auto_sell: True    # If False, bot tracks PnL but DOES NOT SELL. User must exit manually.
  
  # Parallel Strike Scanning (NEW - Performance Enhancement)
  parallel_scanning: True       # Scan all strikes simultaneously (4x faster for 4 strikes)
  selection_mode: "PRICE"       # Options: "PRICE" (cheapest first), "CONFIG_ORDER" (list order)
                                # Future Enhancement: "CONFIDENCE" (score-based selection)

# SYSTEM CONFIGURATION (Advanced)
system:
  loop_intervals:
    scanner: 5                  # Run signal scanner every 5s (Min 3s recommended)
    risk_monitor: 1             # Run risk monitor every 1s (Min 1s recommended)
    position_sync: 10           # Sync positions every 10s (Min 5s recommended)
    config_monitor: 2           # Check config changes every 2s
  
  data_limits:
    trend_bars: 100             # Bars to fetch for Trend TF check (Min 100 for EMA50 × 2)
    exec_bars: 50               # Bars to fetch for Exec TF check (Min 50 for indicators)
    
  cooldowns:
    error_sec: 60               # Cooldown after error/crash (Safe mode)

greeks_monitoring:
  enabled: False                # Display option Greeks in heartbeat (Disabled as requested)
  # When enabled, shows Delta, Gamma, Theta, Vega, IV
  # Adds ~50-100ms per heartbeat (every 10 seconds)
  # Set to False for maximum performance

