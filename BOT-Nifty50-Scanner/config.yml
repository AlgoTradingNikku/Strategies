# ------------------------------------------------------------
# Scan Settings
# ------------------------------------------------------------
exchange: "NSE"

# Change this to scan on a different timeframe
# Supported: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1W, 1M
scan_timeframe: "15m"

# Index segment to scan dynamically from NSE (e.g. NIFTY50, NIFTY200, BANKNIFTY, NIFTYIT)
# If specified, the bot fetches symbols from NSE and ignores the 'symbols' list below.
# Set to "" or comment out to use the custom 'symbols' list instead.
segment: "NIFTY100"

# How many candles to look back for buy signals (including current)
# 3 = current candle + 2 prior candles
signal_lookback_candles: 3

# Scan interval in seconds (for continuous mode)
# Set to 300 for 5-minute re-scans
scan_interval_seconds: 300

# ------------------------------------------------------------
# Custom/Fallback Stocks List
# This is used ONLY when 'segment' above is empty or commented out.
