  apikey: "ff2124a3f1830064ac973cb17a80ce977b3eca9c1a5604d6c67a3b31937860f7"
  username: "rahul.tew"
  base_url: "http://127.0.0.1:5000"
  ws_url: "ws://127.0.0.1:8765"
  order_mode: "auto"                # Order Mode: 'auto' (place orders automatically) | 'manual' (alerts only, user places manual orders)
  allowed_actions: "BUY_ONLY"       # Applies ONLY when order_mode is 'auto'. (Manual web UI orders are always unrestricted)
                                    #   'BUY_ONLY'  -> Auto-place ONLY BUY signals
                                    #   'BOTH'      -> Auto-place both BUY & SELL signals
                                    #   'SELL_ONLY' -> Auto-place ONLY SELL signals
