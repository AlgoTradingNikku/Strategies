# ------------------------------------------------------------
# 5. DATA & SYSTEM SETTINGS
# ------------------------------------------------------------
data:
  lookback_days: 5                   # Days of historical data to fetch

bot:
  log_level: "INFO"                   # Console logging level (INFO, DEBUG, WARNING, etc.)
  market_hours_check: false           # Restrict scanning to market hours only
  market_open: "09:15"
  market_close: "15:30"
  auto_refresh_enabled: true         # Toggle dashboard auto-refresh on page load (uses scan_interval_seconds)

trade_management:
  enabled: true                  # Master switch — set true to activate auto monitoring
  poll_interval_seconds: 5       # Fallback polling interval when WebSocket is unavailable

  # Intraday EOD Auto Square-Off (avoids broker RMS auto-square-off penalty fees)
  auto_square_off_enabled: true  # Automatically square off open positions before market close
  auto_square_off_time: "15:15"  # Time (HH:MM IST 24-hr format) to execute square-off

  # Initial SL and Target (percentage-based, anchored to entry price)
  # Works correctly for ₹50 stocks and ₹5000 stocks alike.
  stop_loss_pct: 1.0             # % below/above entry price for initial SL
  target_pct: 2.0                # % above/below entry price for target

  # ------------------------------------------------------------------
  # Partial Exit — scale out of the position in configurable tranches
  # ------------------------------------------------------------------
  partial_exit:
    enabled: true

    # TIERED mode (takes precedence when `tiers` key is present)
    # Each tier fires once when gain_pct >= trigger_pct.
    # exit_qty_fraction applies to the *remaining* quantity at that point.
    # move_sl_to_be: move stop-loss to breakeven (entry price) after this tier fires.
    tiers:
    - trigger_pct: 1.0            # Fire Tier 1 when profit reaches 1%
      exit_qty_fraction: 0.33     # Exit 33% of position
      move_sl_to_be: true         # Move SL to breakeven

    - trigger_pct: 2.0            # Fire Tier 2 when profit reaches 2%
      exit_qty_fraction: 0.50     # Exit 50% of remaining position
      move_sl_to_be: false

    # LEGACY flat keys (used only when `tiers` list is absent above)
    # target1_pct: 1.0
    # exit_qty_fraction: 0.5
    # move_sl_to_breakeven: true

  # ------------------------------------------------------------------
  # Trailing Stop Loss — dynamically moves SL behind the high-water mark
  # ------------------------------------------------------------------
  trailing_sl:
    enabled: true
    activation_pct: 1.0          # Minimum profit % before trailing activates

    # TIERED mode — tighten the trail as profit grows.
    # The highest tier whose min_gain_pct <= current_gain_pct is applied.
    tiers:
    - min_gain_pct: 1.0
      distance_pct: 0.8          # Keep SL 0.8% behind HWM when profit is 1–2%

    - min_gain_pct: 2.0
      distance_pct: 0.5          # Tighten to 0.5% trail when profit exceeds 2%

    - min_gain_pct: 3.5
      distance_pct: 0.3          # Tighten further to 0.3% when profit exceeds 3.5%

    # LEGACY flat key (used only when `tiers` list is absent above)
    # distance_pct: 0.5

  # ------------------------------------------------------------------
  # Profit Lock — ratchet SL up to lock a fraction of unrealised gain
  # ------------------------------------------------------------------
  profit_lock:
    enabled: true

    # TIERED mode — lock progressively more profit as gains grow.
    # Each tier fires once; SL can only move in the favourable direction.
    # lock_fraction is applied to the absolute gain from entry to HWM.
    # Example: entry=100, HWM=104, lock_fraction=0.5 → new SL = 100 + (4×0.5) = 102
    tiers:
    - threshold_pct: 1.5          # Activate when profit ≥ 1.5%
      lock_fraction: 0.30         # Lock 30% of peak gain as new SL

    - threshold_pct: 2.5          # Activate when profit ≥ 2.5%
      lock_fraction: 0.50         # Lock 50% of peak gain

    - threshold_pct: 4.0          # Activate when profit ≥ 4.0%
      lock_fraction: 0.75         # Lock 75% of peak gain

    # LEGACY flat keys (used only when `tiers` list is absent above)
    # threshold_pct: 1.5
    # lock_fraction: 0.50

  # ------------------------------------------------------------------
  # Notifications (Telegram alerts)
  # ------------------------------------------------------------------
  notifications:
    on_open: true                # Alert when a new position is registered
    on_exit: true                # Alert on full position close (target / SL / manual)
    on_partial_exit: true        # Alert on each partial (scaled-out) exit
    on_profit_lock: true         # Alert when profit-lock SL is ratcheted up
    on_sl_move: false            # Alert on every trailing SL adjustment (verbose)


