# ------------------------------------------------------------
# Risk Limits — pre-trade gate for auto orders (all keys optional)
# ------------------------------------------------------------
# All defaults are permissive; nothing changes unless risk_limits.enabled is true.
risk_limits:
  enabled: false                    # Master toggle for the gate
  max_concurrent_positions: 5       # Reject when open positions >= this count
  max_positions_per_symbol: 1       # Reject duplicate direction/symbol churn
  daily_loss_stop_pct: -3           # Reject new trades once today's realized PnL% ≤ this floor
                                    # (negative → loss cutoff; sum of pnl_pct across trades closed since local midnight)
  daily_loss_stop_rupees:           # Optional absolute ₹ floor (e.g. -500 blocks after ₹500 loss).
                                    # null → disabled. Applied in ADDITION to daily_loss_stop_pct.

  # ---- Sprint-2 additions: capital & risk-based sizing ----
  # ``capital`` is the ₹ amount deployable per trade idea. Bounds are
  # ₹10,000 – ₹10,00,000 unless capital_allow_unlimited is true. Values
  # outside this range are clamped with a warning.
  capital: 100000                   # ₹1L default (mid-range)
  capital_allow_unlimited: false    # true → skip the 10k-10L bounds check
  sizing_mode: "legacy"             # "risk_based" | "capital_pct" | "legacy"
                                    # risk_based → qty = floor(capital × risk_pct% / |entry-SL|)
                                    #              [industry-standard fixed-fractional; safest]
                                    # capital_pct → qty = floor(capital / entry)  [deploys full capital]
                                    # legacy      → preserves pre-Sprint-2 openalgo.capital_per_trade behaviour
  risk_per_trade_pct: 1             # Only used when sizing_mode="risk_based". % of capital risked
                                    # per trade. Default 1% is the classical Van Tharp rule.

  # ---- Sprint-3 additions: grade multiplier & portfolio exposure cap ----
  # Scale the per-trade risk % by the signal's letter grade (see signal_grading
  # below). OFF by default — check /api/statistics → by_grade for a real
  # win-rate edge across grades BEFORE enabling, otherwise you're just adding
  # variance. Multipliers are hard-capped at 3.0x to survive decimal typos.
  grade_multiplier_enabled: false
  grade_multipliers:
    A: 1.5                          # 1% base risk → 1.5% risked on an A setup
    B: 1
    C: 0.75
    D: 0.5
  # Caps the SUM of open entry-notional (qty × entry_price) across all open
  # positions, expressed as a % of `capital` above. 300 → up to 3× per-trade
  # capital deployed at once. null → disabled. Only active when
  # risk_limits.enabled is true. This bounds real ₹ at risk, which
  # max_concurrent_positions cannot once grade multipliers vary trade size.
  max_portfolio_exposure_pct: 300

# ------------------------------------------------------------
# Signal Grading (Sprint 3) — A/B/C/D quality letter per signal
# ------------------------------------------------------------
# Distinct from `setup_score`: that counts how many configured rules fired,
# this measures how favourable the market CONTEXT was, using five continuous
# factors normalised to 0..1 and then weighted. Because it doesn't depend on
# which filters you have switched on, grades stay comparable across config
# changes — which is what makes by-grade win-rate stats meaningful.
#
# Every factor fails OPEN: a missing input earns `unknown_credit` (half credit)
# rather than zero, so one absent data feed can't silently downgrade everything.
signal_grading:
  enabled: true                     # false → grade_signal returns a flat "A"
                                    #         so any min-grade gate is a no-op
  min_grade_to_trade: "D"           # A | B | C | D. "D" is the lowest grade, so
                                    # the default NEVER blocks a trade —
                                    # Sprint 3 ships observe-only. Raise to "C"
                                    # or "B" once by_grade stats justify it.

  # Weights need not sum to 100 — the composite is normalised by their total.
  # Set any weight to 0 to drop that factor entirely (e.g. rs: 0 when scanning
  # a universe with no meaningful NIFTY benchmark).
  weights:
    adx: 25                         # trend strength (direction-agnostic)
    rs: 20                          # relative strength vs NIFTY50, direction-aware
    sr_proximity: 20                # closeness to nearest S/R boundary → tight stop
    mtf: 20                         # higher-timeframe trend agreement
    engine: 15                      # both UT-Bot + S/R fired = highest conviction

  thresholds:                       # score floors, evaluated A → B → C, else D
    A: 75
    B: 60
    C: 45

  adx_floor: 20                     # ADX at/below this earns 0 for the adx factor
  adx_strong: 35                    # ADX at/above this earns full adx credit
  rs_strong: 1.1                    # BUY needs RS ≥ this for full credit;
                                    # SELL target is mirrored about 1.0 (→ 0.90)
  sr_near_pct: 0.5                  # within this % of an S/R edge → full credit
  sr_far_pct: 3                     # beyond this % from any S/R edge → 0 credit
  mtf_neutral_credit: 0.6           # partial credit when the HTF trend is neutral
  unknown_credit: 0.5               # credit granted when a factor's input is missing

