# Bot-UTBot-SR Channels — Configuration

data_source: "openalgo"               # Options: "yfinance", "openalgo", "tvdatafeed", "twelvedata"
trading_api_source: "openalgo"        # Options: "openalgo", "flattrade", "mstock", "shoonya", "dhan"
exchange: "NSE"                       # Target exchange

# ============================================================================
# API RATE LIMITING — Prevent broker API blocks (Sprint 4)
# ============================================================================
# Token bucket algorithm: allows burst traffic while maintaining average rate.
# Applies to ALL broker API calls (order placement, LTP, positions, etc.)
#
# TO DISABLE RATE LIMITING (make unlimited):
#   Set enabled: false
#
# RECOMMENDED SETTINGS BY BROKER (if enabled):
#   OpenAlgo:   10-15 req/sec (proxies to underlying broker)
#   Flattrade:  10 req/sec
#   Dhan:       3 req/sec (STRICTEST - only 3 allowed!)
#   Shoonya:    10 req/sec
#   MStock:     10 req/sec
#   Unlimited:  Set enabled: false
#
# HOW IT WORKS:
#   - Bucket holds tokens (max = burst_size)
#   - Tokens refill at max_requests_per_second rate
#   - Each API call consumes 1 token
#   - If no tokens available, request waits until refill
#
# EXAMPLE: rate=10, burst=15
#   - Can make 15 calls instantly (burst)
#   - Then limited to 10 calls/second average
# ============================================================================
api_rate_limit:
  enabled: true                       # Master toggle: true = rate limiting ON, false = UNLIMITED
  max_requests_per_second: 10         # Average rate limit (ignored if enabled: false)
  burst_size: 15                      # Allow short bursts (ignored if enabled: false)

candle_timeframe: "5m"              # Chart LTF candle resolution for signal analysis (e.g., 1m, 3m, 5m, 15m, 30m, 1h, 1d)
scan_interval_seconds: 300          # Scan / Auto-refresh interval in seconds (e.g., 60 = 1m, 120 = 2m, 300 = 5m)

# Set to "" or [] to scan only the custom symbols list below
segment:
- BANKNIFTY
- NIFTY
use_symbols: true

symbols:
- RPOWER
- IOC
strategy:
  ut_enabled: true
  key_value: 1                        # Key Value / Sensitivity (default: 1.0)
  atr_period: 2                       # ATR Period (default: 2)
  use_heikin_ashi: false              # Use Heikin Ashi candle close as price source
  signal_on_closed_bar: true          # true = ignore the still-forming candle (TradingView-parity, avoids intrabar flicker)
                                      # false = evaluate the running bar (earlier alerts, but signals can flip mid-bar)

signal_lookback_candles: 2

# Support/Resistance Channels Settings
sr_channels:
  enabled: true
  pivot_period: 10                    # Period to confirm a pivot (range: 4 to 30)
  source: "High/Low"                  # Source prices: "High/Low" or "Close/Open"
  channel_width_pct: 5                # Max channel width as % of 300-bar price range (1 to 8)
  min_strength: 1                     # Minimum pivot strength to qualify a zone
  max_num_sr: 6                       # Maximum number of active S/R zones (1 to 10)
  loopback: 290                       # Bars to scan for pivot collection (100 to 400)
  proximity_pct: 0.2                  # % from boundary to count as "near" (0.0 disables near)

# Momentum Engine (Sprint 1.5) — Trend Continuation Signals
# Combines RSI, Volume, ADX, EMA, BB, and ROC to detect strong trending moves.
momentum:
  enabled: false                      # Enable/disable momentum signals
  min_score: 60                       # Minimum score (0-100) to trigger a signal
  # RSI Component (40-70 buy zone, 30-60 sell zone)
  rsi_enabled: true
  rsi_period: 14
  rsi_buy_zone:                       # [min, max] for bullish momentum
  - 40
  - 70
  rsi_sell_zone:                      # [min, max] for bearish momentum
  - 30
  - 60
  rsi_weight: 20                      # Contribution to total score (0-100)
  # Volume Surge Component
  volume_enabled: true
  volume_sma_period: 20
  volume_surge_min: 1.5               # Volume must be 1.5× average
  volume_weight: 20

  # ADX Trend Strength Component
  adx_enabled: true
  adx_period: 14
  adx_min_threshold: 20               # Weak trend threshold
  adx_strong_threshold: 25            # Strong trend threshold
  adx_weight: 15

  # EMA Trend Filter Component
  ema_enabled: true
  ema_period: 200                     # Long-term trend filter
  ema_weight: 20

  # Bollinger Bands Breakout Component
  bb_enabled: true
  bb_period: 20
  bb_std_dev: 2
  bb_weight: 10

  # Rate of Change Component
  roc_enabled: true
  roc_period: 10
  roc_threshold: 3                    # % change threshold
  roc_weight: 15

# Mean Reversion Engine (Sprint 1.5) — Snap-Back Signals
# Detects stretched price moves likely to revert to mean.
mean_reversion:
  enabled: false                      # Enable/disable mean reversion signals
  min_score: 60                       # Minimum score (0-100) to trigger a signal
  # Bollinger Bands Touch Component
  bb_enabled: true
  bb_period: 20
  bb_std_dev: 2
  bb_touch_threshold: 0.02            # Within 2% of band = touch
  bb_weight: 25

  # RSI Extreme Component
  rsi_extreme_enabled: true
  rsi_extreme_period: 14
  rsi_oversold: 30                    # Buy when RSI < 30
  rsi_overbought: 70                  # Sell when RSI > 70
  rsi_extreme_weight: 20

  # Stochastic Oscillator Component
  stochastic_enabled: true
  stoch_k_period: 14
  stoch_d_period: 3
  stoch_smooth_k: 3
  stoch_oversold: 20
  stoch_overbought: 80
  stoch_weight: 15

  # Z-Score Deviation Component
  zscore_enabled: true
  zscore_period: 50
  zscore_threshold: 2                 # ±2 std devs from mean
  zscore_weight: 20

  # Williams %R Component
  williams_enabled: true
  williams_period: 14
  williams_oversold: -80
  williams_overbought: -20
  williams_weight: 10

  # CCI Extreme Component
  cci_enabled: true
  cci_period: 20
  cci_oversold: -100
# Momentum-ChatGPT Strategy Engine — Comprehensive Swing Momentum
# Features Market Regime, Sector Strength, Setup Detection (Breakout/Retest/Continuation), Scoring & Risk Sizing
momentum_chatgpt:
  enabled: false                      # Enable/disable Momentum-ChatGPT signals
  min_score: 60                       # Minimum score (0-100) to trigger a signal
  execution_mode: READ_ONLY           # READ_ONLY, PAPER, MANUAL_APPROVAL, LIVE
  # Subcomponent Toggles
  regime_enabled: true                # Market Regime (NIFTY 50 & Breadth)
  sector_enabled: true                # Sector Relative Strength
  momentum_enabled: true              # Stock Momentum (EMA, RSI, ADX, Vol)
  setup_enabled: true                 # Setup Detection (Breakout/Retest/Consolidation)
  # Universe & Liquidity Filters
  primary_universe: NIFTY200
  min_history_bars: 300               # Required historical bars for scan validation
  min_turnover_20d_crore: 25          # Minimum 20D turnover (₹ Crore)
  min_price: 100                      # Minimum close price (₹)
  # Setup & Technical Components
  rsi_enabled: true
  rsi_period: 14
  rsi_buy_zone:
  - 55
  - 75
  adx_enabled: true
  adx_period: 14
  adx_min_threshold: 20
  volume_enabled: true
  volume_surge_min: 1.5

  # Risk & Portfolio Constraints
  risk_per_trade_pct: 0.5             # Risk per trade (% of portfolio capital)
  max_position_pct: 15                # Max capital per position (%)
  max_sector_exposure_pct: 30         # Max sector exposure (%)
  max_positions: 8                    # Maximum open positions
  minimum_cash_pct: 20                # Minimum reserved cash (%)
  max_correlation: 0.7                # Max 60D return correlation allowed between candidates
  min_rr_ratio: 1.5                   # Minimum Reward-to-Risk ratio
  preferred_rr_ratio: 2               # Target Reward-to-Risk ratio


  cci_overbought: 100
  cci_weight: 10

# Market Regime Classifier (Sprint 1.5)
# Every scan tags its signals with the current regime, computed from NIFTY.
# Used by the journal (get_statistics → by_regime) and, in Sprint 2, will be
# used as a gate to enable/disable engines per regime.
regime:
  gate_enabled: false                 # Sprint-2: master switch for the regime gate.
                                      # false → tag signals with regime but never skip them (safe default;
                                      #         lets you collect win-rate-by-regime baseline data first).
                                      # true  → skip signals whose engine is disabled in the current regime.
  adx_trend_threshold: 22             # ADX >= this is treated as a trend
  adx_strong_threshold: 30            # ADX >= this is a strong trend (reserved)
  vol_lookback: 20                    # bars over which realised vol is computed
  vol_percentile_window: 200          # bars over which vol is ranked
  vol_high_percentile: 0.8            # >= this percentile -> "high_vol_chop"
  min_bars: 50                        # below this many bars -> "unknown"
  # Per-regime engine policy — read by regime.should_enable_engine().
  # Sprint 1.5 only *tags* signals; Sprint 2 will *gate* on these.
  policy:
    trending_up: {utbot: true, sr: true}
    trending_down: {utbot: true, sr: true}
    chop: {utbot: false, sr: true}
    high_vol_chop: {utbot: false, sr: false}
    unknown: {utbot: true, sr: true}

# Setup Filters & Priorities
filters:

  candle_patterns_enabled: true       # Detect candlestick patterns at S/R zones
  # --- Multi-Timeframe Confirmation ---
  mtf_filter_enabled: false           # false = score only, no rejection | true: Rejects signals against HTF trend
  mtf_timeframe: "15m"                # Higher TF to check UTBot trend direction
  mtf_neutral_pct: 0.3                # % proximity to trail to classify trend as "neutral"
  mtf_atr_period: 10                  # ATR period used for UTBot trail on the HTF (separate from LTF atr_period)
                                      # For a smoother trail on the higher timeframe, use 10 or 14.
                                      # Lower values (e.g. 2) make the HTF trail sensitive and flip-prone.

  # --- EMA Trend Filter ---
  # Regardless of the toggle 'true' or 'false': close above EMA always adds +20 pts to BUY; below EMA adds +20 pts to SELL.
  # Filter (when true): hard-rejects/completely rejects BUY signals where close <= EMA, and SELL signals where close >= EMA.
  ema_filter_enabled: false
  ema_period: 200                     # EMA period for trend filter and scoring (e.g. 50, 100, 200)

  # --- Volume Filter ---
  # Regardless of the toggle 'true' or 'false':: volume surge always contributes up to +20 pts (10 × vol/SMA, capped at 20) — regardless of this toggle true or false
  # Filter (when true): hard-rejects any signal where current volume < volume_min_pct % of its SMA.
  volume_filter_enabled: false        # false = no rejection of stocks in results, only adds points | true: Rejects the low-volume stocks in scanned results
  volume_sma_period: 20               # SMA period for volume moving average (e.g. 10, 20, 50)
  volume_min_pct: 60                  # Min volume as % of SMA to pass the hard filter (e.g. 60 = reject if vol < 60% of SMA)

  # --- Alert Score Cutoff ---
  min_alert_score: 70                 # Minimum setup score to send priority Telegram alert (0-100)

  # --- ADX Trend Strength ---
  adx_filter_enabled: false           # false = score only, no rejection | true: Rejects the stocks when ADX < threshold
  adx_min_threshold: 20               # ADX below this = no trend, reject signal (when hard filter ON)
  adx_strong_threshold: 25            # ADX >= this = strong trend (+10 pts to score)
  adx_moderate_threshold: 20          # ADX >= this = moderate trend (+5 pts to score)

  # --- RSI Momentum Scoring ---
  rsi_filter_enabled: false           # false = no rejection of stocks in results, only adds points when RSI is outside optimal range | true: Rejects the stocks when RSI is outside optimal range 
  rsi_period: 14                      # RSI calculation period
  rsi_buy_min: 40                     # BUY gets +10 pts when RSI is between buy_min and buy_max
  rsi_buy_max: 65
  rsi_sell_min: 35                    # SELL gets +10 pts when RSI is between sell_min and sell_max
  rsi_sell_max: 60

  # --- Relative Strength vs NIFTY ---
  rs_period: 20                       # Lookback bars for RS ratio calculation vs NIFTY50
  rs_buy_threshold: 1.1               # RS ratio above this = outperforming NIFTY (+10 pts for BUY)
  rs_sell_threshold: 0.9              # RS ratio below this = underperforming NIFTY (+10 pts for SELL)

  # --- Risk/Reward Calculator ---
  risk_reward_enabled: false           # Calculate SL/Target/R:R for each signal
  rr_atr_multiplier: 0.5              # ATR buffer added beyond stop level
  rr_default_ratio: 2                 # Default target R:R when no S/R zone found

  # --- Volatility Squeeze (TTM Squeeze) ---
  squeeze_filter_enabled: false        # true: Rejects signals if not in a squeeze release
  squeeze_length: 20                  # Length for BB and KC
  squeeze_bb_mult: 2                  # Bollinger Bands std dev multiplier
  squeeze_kc_mult: 1.5                # Keltner Channels ATR multiplier


  # --- Signal History & Outcome Tracking ---
  signal_history_enabled: true        # Log signals to SQLite for outcome tracking
  outcome_check_hours: 4              # Hours after signal to check outcome
  win_rate_backtest_enabled: false   # Run mini-backtest on triggered symbols to compute historical win rate

