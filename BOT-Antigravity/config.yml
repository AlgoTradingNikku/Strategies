# ------------------------------------------------------------
# UT Bot Strategy Parameters
# ------------------------------------------------------------
strategy:
  # Key Value — changes the sensitivity of the ATR trailing stop
  key_value: 2

  # ATR Period used to compute volatility
  atr_period: 1

  # Use Heikin Ashi candles for signal source (true/false)
  use_heikin_ashi: false

# ------------------------------------------------------------
# Historical Data
# ------------------------------------------------------------
data:
  # Number of calendar days to look back for historical candles
  lookback_days: 5

# ------------------------------------------------------------
# Signal Check
# ------------------------------------------------------------
bot:
  # Interval (in seconds) between signal checks
  signal_check_interval: 5

  # Market open/close times (IST, 24h format)
  market_open: "09:15"
  market_close: "23:30"