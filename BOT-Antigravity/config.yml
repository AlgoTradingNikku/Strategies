# ============================================================
# UT Bot Antigravity - Configuration
# ============================================================

openalgo:
  apikey: "0ea69e6165a81731f9a37d4ab47778f7649ead857a80ac777b727863d1cf780c"
  username: "rahul.tew"
  base_url: "http://127.0.0.1:5000"
  ws_url: "ws://127.0.0.1:8765"

# ------------------------------------------------------------
# Symbols & Exchange
# ------------------------------------------------------------
symbols:
  - IOC
  - BANKINDIA
  - PNB
  - RPOWER

exchange: "NSE"

# ------------------------------------------------------------
# Timeframes to monitor (can be any combination)
# Valid values: 1m, 3m, 5m, 10m, 15m, 30m, 1h, D
# ------------------------------------------------------------
timeframes:
  - "5m"
  - "15m"
  #- "30m"

# ------------------------------------------------------------
# UT Bot Strategy Parameters
# ------------------------------------------------------------
strategy:
  # Key Value — changes the sensitivity of the ATR trailing stop
  key_value: 2

  # ATR Period used to compute volatility
  atr_period: 1

  # Use Heikin Ashi candles for signal source (true/false)
  use_heikin_ashi: false

# ------------------------------------------------------------
# Historical Data
# ------------------------------------------------------------
data:
  # Number of calendar days to look back for historical candles
  lookback_days: 5

# ------------------------------------------------------------
# Signal Check
# ------------------------------------------------------------
bot:
  # Interval (in seconds) between signal checks
  signal_check_interval: 5

  # Market open/close times (IST, 24h format)
  market_open: "09:15"
  market_close: "15:30"

  # Logging verbosity: DEBUG | INFO | WARNING | ERROR
  # DEBUG   → shows all internal details (candle boundaries, skipped fetches, etc.)
  # INFO    → normal operation messages (signals, scans, alerts)
  # WARNING → only problems / unexpected events
  log_level: "INFO"

# ------------------------------------------------------------
# ML Filter (XGBoost Signal Confidence Scorer)
# ------------------------------------------------------------
ml:
  # Always log signals to signals.db for training data collection
  log_signals: true

  # Set to true AFTER you have trained a model (python ml_filter.py --train)
  enabled: false

  # Minimum confidence score [0.0-1.0] to allow a Telegram alert through
  confidence_threshold: 0.60

  # How many candles ahead to measure outcome for labelling
  label_lookahead: 5

  # Minimum % price move to count as a WIN when labelling
  win_threshold_pct: 0.3