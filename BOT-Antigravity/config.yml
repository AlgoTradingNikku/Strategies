  - "5m"

# ------------------------------------------------------------
# UT Bot Strategy Parameters
# ------------------------------------------------------------
strategy:
  key_value: 2
  atr_period: 1
  use_heikin_ashi: false

data:
  lookback_days: 5

bot:
  signal_check_interval: 5
  market_hours_check: false   # Set to false to run 24/7 (ignores market_open/close)
  market_open: "09:15"       # For US 07:00 PM IST, INDIA - 09:15
  market_close: "15:30"      # For US 01:30 AM IST, INDIA - 15:30
  log_level: "INFO"

ml:
  log_signals: true
  enabled: false
  confidence_threshold: 0.60
  label_lookahead: 5
  win_threshold_pct: 0.3

# ------------------------------------------------------------
# Auto-Trading (Order Placement)
# ------------------------------------------------------------
trading:
  enabled: true
  strategy_name: "UTBot"

  equity:
    enabled: true
    quantity: 1
    product: "CNC"
    price_type: "LIMIT"

  options:
    enabled: true
    quantity: 65
    product: "NRML"
    price_type: "LIMIT"