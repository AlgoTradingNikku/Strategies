# ------------------------------------------------------------
# Additional Data Sources
# ------------------------------------------------------------
twelvedata:
  apikey: ""

tvdatafeed:
  username: ""
  password: ""

# ------------------------------------------------------------
# Scan Settings
# ------------------------------------------------------------
exchange: "NSE"

# Supported: 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 1d, 1W, 1M
scan_timeframe: "15m"

# Index segment to scan dynamically from NSE
# Set to "" or comment out to use the custom 'symbols' list instead.
segment: "NIFTY100"

# UT Bot lookback: how many candles to check for UT Bot buy/sell signals
# 3 = current candle + 2 prior candles
signal_lookback_candles: 3

# Scan interval in seconds (for continuous mode)
scan_interval_seconds: 300

# ------------------------------------------------------------
# Signal Combination Mode
# ------------------------------------------------------------
# "AND" = all enabled conditions must be true simultaneously
# "OR"  = any one enabled condition triggers the signal
# Or specify a custom logic formula, e.g. "(utbot and S/R Channels) OR (utbot and LinReg)"
signal_mode: "(utbot and S/R Channels) OR (utbot and LinReg) OR (utbot and LinReg and S/R)"

# ------------------------------------------------------------
# UT Bot Strategy Parameters
# ------------------------------------------------------------
strategy:
  ut_enabled: true
  key_value: 2
  atr_period: 1
  use_heikin_ashi: false

# ------------------------------------------------------------
# S/R Channel Parameters
# ------------------------------------------------------------
sr_channels:
  enabled: true
  pivot_period: 10           # Bars on each side to confirm a pivot
  source: "High/Low"        # "High/Low" or "Close/Open"
  channel_width_pct: 5       # Max channel width as % of 300-bar range
  min_strength: 1            # Minimum zone strength to display
  max_num_sr: 6              # Maximum number of S/R zones
  loopback: 290              # Bars to look back for pivot collection
  proximity_pct: 0.5         # % proximity to count as "near" a zone

# ------------------------------------------------------------
# LinReg Candle Parameters
# ------------------------------------------------------------
linreg:
  enabled: true
  length: 11                 # Linear regression window length
  signal_length: 7           # Signal line smoothing length
  use_sma: true              # true = SMA signal line, false = EMA
  proximity_pct: 0.5         # % proximity to count as "near" the signal line

# ------------------------------------------------------------
# Data Settings
# ------------------------------------------------------------
data:
  lookback_days: 5

