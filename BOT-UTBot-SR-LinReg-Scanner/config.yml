# ============================================================
# BOT-UTBot-SR-LinReg-Scanner — Configuration
# ============================================================
# Multi-signal scanner combining UT Bot, S/R Channels, and
# LinReg Candle signals. Each condition can be enabled/disabled
# independently and combined via AND or OR mode.

data_source: "yfinance"   # "yfinance", "openalgo", "tvdatafeed", "twelvedata"

# ------------------------------------------------------------
# Telegram Alerts
